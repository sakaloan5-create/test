<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #222a44, #0e0f1c 65%);
      color: #f5f5f5;
    }

    .game-wrapper {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      width: min(92vw, 720px);
      padding: 24px;
      background: rgba(17, 21, 40, 0.9);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    canvas {
      width: min(86vw, 540px);
      aspect-ratio: 1;
      border-radius: 16px;
      background: #0d111f;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel {
      display: grid;
      gap: 8px;
      text-align: center;
    }

    .panel h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.95rem;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .controls {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
    }

    button {
      background: #4b7bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(75, 123, 255, 0.35);
    }

    .status {
      min-height: 20px;
      color: #ffe479;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="panel">
      <h1>贪吃蛇</h1>
      <div class="stats">
        <span class="badge">得分：<span id="score">0</span></span>
        <span class="badge">最高分：<span id="best">0</span></span>
        <span class="badge">速度：<span id="speed">慢</span></span>
      </div>
      <div class="controls">方向键 / WASD 控制，空格暂停，R 重新开始。</div>
      <div class="status" id="status"></div>
    </div>
    <canvas id="board" width="480" height="480" aria-label="贪吃蛇棋盘"></canvas>
    <button id="restart">重新开始</button>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const speedEl = document.getElementById("speed");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");

    const gridSize = 20;
    const cellSize = canvas.width / gridSize;
    const speedLevels = [140, 110, 90];

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let bestScore = Number(localStorage.getItem("snakeBest")) || 0;
    let tickInterval = speedLevels[0];
    let timer;
    let paused = false;
    let gameOver = false;

    const speedLabel = (value) => {
      if (value <= 95) return "快";
      if (value <= 120) return "中";
      return "慢";
    };

    function resetGame() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      score = 0;
      tickInterval = speedLevels[0];
      paused = false;
      gameOver = false;
      placeFood();
      updateScore();
      statusEl.textContent = "";
      restartTimer();
      draw();
    }

    function updateScore() {
      scoreEl.textContent = score;
      bestEl.textContent = bestScore;
      speedEl.textContent = speedLabel(tickInterval);
    }

    function placeFood() {
      let candidate;
      do {
        candidate = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize),
        };
      } while (snake.some((segment) => segment.x === candidate.x && segment.y === candidate.y));
      food = candidate;
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(tick, tickInterval);
    }

    function tick() {
      if (paused || gameOver) return;
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
        finishGame();
        return;
      }

      if (snake.some((segment) => segment.x === head.x && segment.y === head.y)) {
        finishGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score % 50 === 0 && tickInterval > speedLevels[2]) {
          tickInterval -= 15;
          restartTimer();
        }
        placeFood();
      } else {
        snake.pop();
      }

      updateScore();
      draw();
    }

    function finishGame() {
      gameOver = true;
      statusEl.textContent = "游戏结束！按 R 或点击重新开始。";
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("snakeBest", String(bestScore));
      }
      updateScore();
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i += 1) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      ctx.fillStyle = "#ff7a59";
      ctx.beginPath();
      ctx.arc(
        food.x * cellSize + cellSize / 2,
        food.y * cellSize + cellSize / 2,
        cellSize / 2.4,
        0,
        Math.PI * 2
      );
      ctx.fill();

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4bffb0" : "#2dd4bf";
        ctx.fillRect(
          segment.x * cellSize + 2,
          segment.y * cellSize + 2,
          cellSize - 4,
          cellSize - 4
        );
      });
    }

    function setDirection(x, y) {
      if (paused || gameOver) return;
      if (direction.x === -x && direction.y === -y) return;
      nextDirection = { x, y };
    }

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      statusEl.textContent = paused ? "已暂停，按空格继续。" : "";
    }

    document.addEventListener("keydown", (event) => {
      switch (event.key) {
        case "ArrowUp":
        case "w":
        case "W":
          setDirection(0, -1);
          break;
        case "ArrowDown":
        case "s":
        case "S":
          setDirection(0, 1);
          break;
        case "ArrowLeft":
        case "a":
        case "A":
          setDirection(-1, 0);
          break;
        case "ArrowRight":
        case "d":
        case "D":
          setDirection(1, 0);
          break;
        case " ":
          togglePause();
          break;
        case "r":
        case "R":
          resetGame();
          break;
        default:
          break;
      }
    });

    restartBtn.addEventListener("click", resetGame);

    bestEl.textContent = bestScore;
    resetGame();
  </script>
</body>
</html>
